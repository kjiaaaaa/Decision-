<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>决策 - 极简决策助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: 'var(--brand-color)',
                        'brand-hover': 'var(--brand-hover-color)',
                        'brand-light': 'var(--brand-light-color)',
                        paper: {
                            50: '#fcfbf9',
                            100: '#f5f3ef',
                            200: '#e8e5de',
                            300: '#d5d0c4',
                            700: '#343230',
                            800: '#232220',
                            900: '#191817',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-color: #5a6b5c; /* Default Sage Green */
            --brand-hover-color: #48564a;
            --brand-light-color: rgba(90, 107, 92, 0.12);
        }
        
        body {
            font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* 3D Coin Flip Styling */
        .coin-container {
            perspective: 800px;
        }

        .coin {
            width: 150px;
            height: 150px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 2.8s cubic-bezier(0.15, 0.85, 0.35, 1.2);
            cursor: pointer;
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 2.2rem;
            letter-spacing: 0.1em;
            box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.12), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(180, 180, 180, 0.3);
        }

        .coin-front {
            background: linear-gradient(135deg, var(--brand-color), #7a8c7c);
            color: #ffffff;
        }

        .coin-back {
            background: linear-gradient(135deg, #7c6860, #a18b82);
            color: #ffffff;
            transform: rotateY(180deg);
        }

        /* Interactive Card Deck Styling */
        .cards-deck-container {
            perspective: 1000px;
        }

        .draw-card {
            width: 135px;
            height: 195px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        .draw-card.flipped {
            transform: rotateY(180deg) translateY(-8px);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(200, 195, 185, 0.3);
        }

        .card-back {
            background: linear-gradient(135deg, #2c2b29, #3f3d3a);
            color: #d5d0c4;
            transform: rotateY(0deg);
        }

        .dark .card-back {
            background: linear-gradient(135deg, #262523, #1e1d1c);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .card-front {
            background: #fcfbf9;
            color: #232220;
            transform: rotateY(180deg);
        }

        .dark .card-front {
            background: #201f1e;
            color: #f5f3ef;
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* Card Pattern Overlay */
        .card-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 12px 12px;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(160, 160, 160, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-paper-100 dark:bg-paper-900 text-paper-800 dark:text-paper-100 min-h-screen flex flex-col transition-colors duration-300 overflow-x-hidden">

    <header class="sticky top-0 z-40 backdrop-blur-md bg-paper-100/80 dark:bg-paper-900/80 border-b border-paper-200 dark:border-paper-800 px-5 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="w-7 h-7 rounded-full bg-brand text-white flex items-center justify-center font-bold text-sm shadow-sm">策</span>
            <h1 class="font-semibold text-lg tracking-widest text-paper-800 dark:text-paper-100">
                决策
            </h1>
        </div>
        
        <div class="flex items-center space-x-3 text-paper-800 dark:text-paper-100">
            <!-- Audio Toggle -->
            <button id="sound-toggle" class="p-2 rounded-full hover:bg-paper-200 dark:hover:bg-paper-800 transition-colors text-sm" title="音效开关">
                <i class="fa-solid fa-volume-high text-xs opacity-70" id="sound-icon"></i>
            </button>
            <!-- Palette Selector Toggle -->
            <button id="color-picker-btn" class="p-2 rounded-full hover:bg-paper-200 dark:hover:bg-paper-800 transition-colors text-sm" title="配色主题">
                <i class="fa-solid fa-palette text-xs opacity-70"></i>
            </button>
            <!-- Dark / Light Mode Switcher -->
            <button id="theme-toggle" class="p-2 rounded-full hover:bg-paper-200 dark:hover:bg-paper-800 transition-colors text-sm" title="切换黑白模式">
                <i class="fa-solid fa-moon text-xs opacity-70 dark:hidden"></i>
                <i class="fa-solid fa-sun text-xs opacity-70 hidden dark:block"></i>
            </button>
            <!-- History Toggle -->
            <button id="history-toggle" class="p-2 rounded-full hover:bg-paper-200 dark:hover:bg-paper-800 transition-colors text-sm" title="历史记录">
                <i class="fa-solid fa-clock-rotate-left text-xs opacity-70"></i>
            </button>
        </div>
    </header>

    <!-- Expanded Palette Popover -->
    <div id="color-palette-popover" class="hidden fixed top-16 right-5 z-50 bg-paper-50 dark:bg-paper-800 p-4 rounded-2xl shadow-xl border border-paper-200 dark:border-paper-700/60 w-72 backdrop-blur-md animate-in fade-in zoom-in-95 duration-150">
        <div class="text-[11px] font-semibold text-gray-400 dark:text-gray-400 tracking-widest mb-3 flex items-center justify-between">
            <span>淡雅主题配色</span>
            <span id="current-color-name" class="text-brand font-medium">鼠尾草绿</span>
        </div>
        <div class="grid grid-cols-5 gap-2.5" id="color-options">
            <button data-name="鼠尾草绿" data-color="#5a6b5c" data-hover="#48564a" title="鼠尾草绿" class="w-8 h-8 rounded-full bg-[#5a6b5c] transition-transform hover:scale-110 ring-2 ring-transparent hover:ring-paper-300"></button>
            <button data-name="暮紫灰" data-color="#706d7e" data-hover="#5b5869" title="暮紫灰" class="w-8 h-8 rounded-full bg-[#706d7e] transition-transform hover:scale-110 ring-2 ring-transparent hover:ring-paper-300"></button>
            <button data-name="暖琥珀" data-color="#9a7b66" data-hover="#836652" title="暖琥珀" class="w-8 h-8 rounded-full bg-[#9a7b66] transition-transform hover:scale-110 ring-2 ring-transparent hover:ring-paper-300"></button>
            <button data-name="黛蓝灰" data-color="#576975" data-hover="#45545e" title="黛蓝灰" class="w-8 h-8 rounded-full bg-[#576975] transition-transform hover:scale-110 ring-2 ring-transparent hover:ring-paper-300"></button>
            <button data-name="亚麻棕" data-color="#80766d" data-hover="#686058" title="亚麻棕" class="w-8 h-8 rounded-full bg-[#80766d] transition-transform hover:scale-110 ring-2 ring-transparent hover:ring-paper-300"></button>
            <button data-name="薄荷灰绿" data-color="#51786c" data-hover="#3f6056" title="薄荷灰绿" class="w-8 h-8 rounded-full bg-[#51786c] transition-transform hover:scale-110 ring-2 ring-transparent hover:ring-paper-300"></button>
            <button data-name="玫瑰粉褐" data-color="#8c6a72" data-hover="#73535a" title="玫瑰粉褐" class="w-8 h-8 rounded-full bg-[#8c6a72] transition-transform hover:scale-110 ring-2 ring-transparent hover:ring-paper-300"></button>
            <button data-name="栗木棕" data-color="#6e574c" data-hover="#59443a" title="栗木棕" class="w-8 h-8 rounded-full bg-[#6e574c] transition-transform hover:scale-110 ring-2 ring-transparent hover:ring-paper-300"></button>
            <button data-name="桂花橙黄" data-color="#947348" data-hover="#7b5d37" title="桂花橙黄" class="w-8 h-8 rounded-full bg-[#947348] transition-transform hover:scale-110 ring-2 ring-transparent hover:ring-paper-300"></button>
            <button data-name="深邃灰黑" data-color="#4a4d52" data-hover="#37393d" title="深邃灰黑" class="w-8 h-8 rounded-full bg-[#4a4d52] transition-transform hover:scale-110 ring-2 ring-transparent hover:ring-paper-300"></button>
            <button data-name="陶土红" data-color="#8b5e52" data-hover="#734b41" title="陶土红" class="w-8 h-8 rounded-full bg-[#8b5e52] transition-transform hover:scale-110 ring-2 ring-transparent hover:ring-paper-300"></button>
            <button data-name="雾霭蓝" data-color="#5e7285" data-hover="#4b5d6e" title="雾霭蓝" class="w-8 h-8 rounded-full bg-[#5e7285] transition-transform hover:scale-110 ring-2 ring-transparent hover:ring-paper-300"></button>
        </div>
    </div>

    <!-- Mode Selector Tab -->
    <nav class="max-w-sm mx-auto w-full px-5 pt-5">
        <div class="bg-paper-200/60 dark:bg-paper-800/60 p-1 rounded-2xl flex text-xs font-semibold">
            <button id="tab-coin" class="flex-1 py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center space-x-2 bg-paper-50 dark:bg-paper-800 text-paper-900 dark:text-paper-100 shadow-sm">
                <i class="fa-solid fa-coins opacity-60"></i>
                <span>决策硬币</span>
            </button>
            <button id="tab-cards" class="flex-1 py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center space-x-2 text-gray-500 dark:text-gray-400 hover:text-paper-900 dark:hover:text-paper-100">
                <i class="fa-solid fa-layer-group opacity-60"></i>
                <span>抽卡决策</span>
            </button>
        </div>
    </nav>

    <main class="flex-1 max-w-sm mx-auto w-full px-5 py-4 flex flex-col justify-center">

        <!-- SECTION 1: Decision Coin (是 / 否) -->
        <section id="coin-section" class="flex flex-col items-center justify-between py-6 min-h-[440px] transition-all">
            <div class="text-center space-y-1">
                <h2 class="text-xl font-bold tracking-widest">是 否 决 策</h2>
                <p class="text-xs text-gray-400 dark:text-gray-500">抛出硬币，顺从直觉</p>
            </div>

            <div class="my-8 coin-container flex items-center justify-center">
                <div id="coin" class="coin">
                    <div class="coin-face coin-front">
                        <span>是</span>
                    </div>
                    <div class="coin-face coin-back">
                        <span>否</span>
                    </div>
                </div>
            </div>

            <!-- Result Box -->
            <div class="text-center h-10 flex items-center justify-center">
                <div id="coin-result" class="text-xl font-bold tracking-widest text-brand opacity-0 transition-opacity duration-300">
                    --
                </div>
            </div>

            <!-- Action Button -->
            <div class="w-full">
                <button id="flip-btn" class="w-full py-3.5 bg-brand hover:bg-brand-hover text-white rounded-2xl font-medium text-sm tracking-widest shadow-md active:scale-95 transition-all duration-150 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-rotate text-xs opacity-80"></i>
                    <span>抛掷硬币</span>
                </button>
            </div>
        </section>

        <!-- SECTION 2: Draw Cards (抽卡决策) -->
        <section id="cards-section" class="hidden flex-col items-center justify-between py-4 min-h-[450px] space-y-4">
            
            <div class="text-center space-y-1">
                <h2 class="text-xl font-bold tracking-widest">抽 卡 决 策</h2>
                <p class="text-xs text-gray-400 dark:text-gray-500">点击卡牌翻开结果</p>
            </div>

            <!-- Interactive Deck Display -->
            <div class="cards-deck-container my-4 flex items-center justify-center min-h-[210px] w-full">
                <div id="draw-card" class="draw-card">
                    <!-- Back Side (Face Down) -->
                    <div class="card-face card-back card-pattern flex flex-col items-center justify-between">
                        <div class="w-full text-right text-[10px] opacity-40">策</div>
                        <div class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center">
                            <i class="fa-solid fa-sparkles text-xs opacity-50"></i>
                        </div>
                        <div class="text-[11px] tracking-widest opacity-60">点击翻牌</div>
                    </div>
                    <!-- Front Side (Result) -->
                    <div class="card-face card-front flex flex-col items-center justify-center text-center">
                        <div class="text-xs text-gray-400 dark:text-gray-500 mb-2">抽取结果</div>
                        <div id="card-result-text" class="text-base font-bold tracking-wider text-brand px-2">
                            请先添加选项
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card Controls -->
            <div class="w-full grid grid-cols-4 gap-2">
                <button id="draw-card-btn" class="col-span-3 py-3.5 bg-brand hover:bg-brand-hover text-white rounded-2xl font-medium text-sm tracking-widest shadow-md active:scale-95 transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-hand-pointer text-xs opacity-80"></i>
                    <span>抽取一张</span>
                </button>
                <button id="manage-options-btn" class="col-span-1 py-3.5 bg-paper-200 dark:bg-paper-800 text-paper-800 dark:text-paper-100 rounded-2xl font-medium text-xs active:scale-95 transition-all flex items-center justify-center" title="自定义选项">
                    <i class="fa-solid fa-pen-to-square text-sm opacity-70"></i>
                </button>
            </div>

            <!-- Options Count Badge -->
            <div class="w-full flex items-center justify-between text-xs text-gray-400 dark:text-gray-500 px-1">
                <span id="option-count-text">自定义选项 (0)</span>
                <button id="shuffle-btn" class="text-xs text-brand hover:underline flex items-center space-x-1">
                    <i class="fa-solid fa-shuffle text-[10px]"></i>
                    <span>洗牌重置</span>
                </button>
            </div>
        </section>

    </main>

    <!-- Custom Options Modal -->
    <div id="options-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm hidden flex-col justify-end transition-opacity duration-200">
        <div class="bg-paper-50 dark:bg-paper-900 rounded-t-3xl max-h-[80vh] flex flex-col w-full max-w-sm mx-auto p-5 shadow-2xl border-t border-paper-200 dark:border-paper-800 animate-in slide-in-from-bottom duration-200">
            <div class="flex items-center justify-between pb-3 border-b border-paper-200 dark:border-paper-800">
                <h3 class="font-bold text-base tracking-wider">编辑我的决策选项</h3>
                <button id="close-options-btn" class="w-7 h-7 rounded-full bg-paper-200 dark:bg-paper-800 flex items-center justify-center text-xs text-gray-500">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Option Add Input Form -->
            <div class="flex space-x-2 my-4">
                <input type="text" id="new-option-input" placeholder="输入自定义选项..." maxlength="25" class="flex-1 bg-paper-100 dark:bg-paper-800 border-0 rounded-xl px-4 py-2.5 text-xs focus:ring-1 focus:ring-brand outline-none transition-all">
                <button id="add-option-btn" class="bg-brand text-white px-4 rounded-xl font-medium text-xs hover:bg-brand-hover active:scale-95 transition-all">
                    添加
                </button>
            </div>

            <!-- Options List -->
            <div id="options-list" class="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1 my-2 min-h-[160px] max-h-[280px]">
                <!-- Dynamic Items -->
            </div>

            <div class="pt-3 border-t border-paper-200 dark:border-paper-800 flex space-x-2">
                <button id="clear-options-btn" class="w-1/3 py-2.5 rounded-xl border border-red-200 dark:border-red-900/40 text-red-500 text-xs font-medium hover:bg-red-50 dark:hover:bg-red-950/20">
                    清空
                </button>
                <button id="save-options-btn" class="w-2/3 py-2.5 rounded-xl bg-brand text-white text-xs font-medium shadow-sm hover:bg-brand-hover">
                    完成保存
                </button>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm hidden flex-col justify-end transition-opacity duration-200">
        <div class="bg-paper-50 dark:bg-paper-900 rounded-t-3xl max-h-[75vh] flex flex-col w-full max-w-sm mx-auto p-5 shadow-2xl border-t border-paper-200 dark:border-paper-800 animate-in slide-in-from-bottom duration-200">
            <div class="flex items-center justify-between pb-3 border-b border-paper-200 dark:border-paper-800">
                <div class="flex items-center space-x-2">
                    <h3 class="font-bold text-base tracking-wider">决策历史</h3>
                </div>
                <button id="close-history-btn" class="w-7 h-7 rounded-full bg-paper-200 dark:bg-paper-800 flex items-center justify-center text-xs text-gray-500">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- History List -->
            <div id="history-list" class="flex-1 overflow-y-auto custom-scrollbar space-y-2 my-4 pr-1 min-h-[180px] max-h-[320px]">
                <!-- Dynamic Items -->
            </div>

            <div class="pt-3 border-t border-paper-200 dark:border-paper-800">
                <button id="clear-history-btn" class="w-full py-2.5 rounded-xl bg-paper-200 dark:bg-paper-800 text-paper-800 dark:text-paper-200 text-xs font-medium hover:bg-paper-300 dark:hover:bg-paper-700">
                    清除历史记录
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // App State
            const state = {
                theme: localStorage.getItem('theme') || 'dark',
                brandColor: localStorage.getItem('brandColor') || '#5a6b5c',
                brandHover: localStorage.getItem('brandHover') || '#48564a',
                brandName: localStorage.getItem('brandName') || '鼠尾草绿',
                soundEnabled: localStorage.getItem('soundEnabled') !== 'false',
                currentTab: 'coin',
                coinFlipping: false,
                cardFlipped: false,
                cardOptions: JSON.parse(localStorage.getItem('userCardOptions')) || [],
                history: JSON.parse(localStorage.getItem('decisionHistory')) || []
            };

            // Synthetic Subtle Audio Effects using Web Audio API
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            function playSound(type) {
                if (!state.soundEnabled) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    if (type === 'flip') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.1);
                        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.1);
                    } else if (type === 'card') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
                        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.15);
                    }
                } catch(e){}
            }

            // Haptic feedback function
            function triggerHaptic() {
                if (navigator.vibrate) {
                    navigator.vibrate(30);
                }
            }

            // DOM Elements
            const coinEl = document.getElementById('coin');
            const coinResultEl = document.getElementById('coin-result');
            const flipBtn = document.getElementById('flip-btn');
            
            const drawCard = document.getElementById('draw-card');
            const cardResultText = document.getElementById('card-result-text');
            const drawCardBtn = document.getElementById('draw-card-btn');
            const shuffleBtn = document.getElementById('shuffle-btn');

            const tabCoin = document.getElementById('tab-coin');
            const tabCards = document.getElementById('tab-cards');
            const coinSection = document.getElementById('coin-section');
            const cardsSection = document.getElementById('cards-section');

            const optionsModal = document.getElementById('options-modal');
            const historyModal = document.getElementById('history-modal');
            const optionsList = document.getElementById('options-list');
            const historyList = document.getElementById('history-list');
            
            const colorPalettePopover = document.getElementById('color-palette-popover');
            const colorPickerBtn = document.getElementById('color-picker-btn');
            const currentColorName = document.getElementById('current-color-name');
            const soundToggleBtn = document.getElementById('sound-toggle');
            const soundIcon = document.getElementById('sound-icon');

            // Theme Management
            function initTheme() {
                if (state.theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                setBrandColor(state.brandColor, state.brandHover, state.brandName);
                updateSoundIcon();
            }

            function setBrandColor(color, hoverColor, name) {
                state.brandColor = color;
                state.brandHover = hoverColor;
                if (name) state.brandName = name;

                document.documentElement.style.setProperty('--brand-color', color);
                document.documentElement.style.setProperty('--brand-hover-color', hoverColor);
                
                if (currentColorName && state.brandName) {
                    currentColorName.textContent = state.brandName;
                }

                localStorage.setItem('brandColor', color);
                localStorage.setItem('brandHover', hoverColor);
                localStorage.setItem('brandName', state.brandName);
            }

            document.getElementById('theme-toggle').addEventListener('click', () => {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('theme', state.theme);
                initTheme();
            });

            // Sound Toggle
            soundToggleBtn.addEventListener('click', () => {
                state.soundEnabled = !state.soundEnabled;
                localStorage.setItem('soundEnabled', state.soundEnabled);
                updateSoundIcon();
            });

            function updateSoundIcon() {
                if (state.soundEnabled) {
                    soundIcon.className = "fa-solid fa-volume-high text-xs opacity-70";
                } else {
                    soundIcon.className = "fa-solid fa-volume-xmark text-xs opacity-40";
                }
            }

            // Color Palette
            colorPickerBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                colorPalettePopover.classList.toggle('hidden');
            });

            document.addEventListener('click', (e) => {
                if (!colorPalettePopover.contains(e.target) && e.target !== colorPickerBtn) {
                    colorPalettePopover.classList.add('hidden');
                }
            });

            document.querySelectorAll('#color-options button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const color = btn.getAttribute('data-color');
                    const hover = btn.getAttribute('data-hover');
                    const name = btn.getAttribute('data-name');
                    setBrandColor(color, hover, name);
                    colorPalettePopover.classList.add('hidden');
                });
            });

            // Tab Switching
            tabCoin.addEventListener('click', () => switchTab('coin'));
            tabCards.addEventListener('click', () => switchTab('cards'));

            function switchTab(tab) {
                state.currentTab = tab;
                if (tab === 'coin') {
                    coinSection.classList.remove('hidden');
                    cardsSection.classList.add('hidden');
                    cardsSection.classList.remove('flex');
                    tabCoin.className = "flex-1 py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center space-x-2 bg-paper-50 dark:bg-paper-800 text-paper-900 dark:text-paper-100 shadow-sm";
                    tabCards.className = "flex-1 py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center space-x-2 text-gray-500 dark:text-gray-400 hover:text-paper-900 dark:hover:text-paper-100";
                } else {
                    coinSection.classList.add('hidden');
                    cardsSection.classList.remove('hidden');
                    cardsSection.classList.add('flex');
                    tabCards.className = "flex-1 py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center space-x-2 bg-paper-50 dark:bg-paper-800 text-paper-900 dark:text-paper-100 shadow-sm";
                    tabCoin.className = "flex-1 py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center space-x-2 text-gray-500 dark:text-gray-400 hover:text-paper-900 dark:hover:text-paper-100";
                    updateOptionCount();
                }
            }

            // Coin Flip Logic
            let currentRotation = 0;
            flipBtn.addEventListener('click', flipCoin);
            coinEl.addEventListener('click', flipCoin);

            function flipCoin() {
                if (state.coinFlipping) return;
                state.coinFlipping = true;
                triggerHaptic();
                playSound('flip');

                coinResultEl.classList.add('opacity-0');
                
                const isYes = Math.random() < 0.5;
                const resultText = isYes ? '是' : '否';

                const baseSpins = 1800; // 5 spins
                const targetAngle = isYes ? 0 : 180;
                
                const extraDegrees = (360 - (currentRotation % 360)) + baseSpins + targetAngle;
                currentRotation += extraDegrees;

                coinEl.style.transform = `rotateY(${currentRotation}deg)`;

                setTimeout(() => {
                    state.coinFlipping = false;
                    coinResultEl.textContent = resultText;
                    coinResultEl.classList.remove('opacity-0');
                    triggerHaptic();

                    addHistory('是 / 否 决策', resultText);
                }, 2800);
            }

            // Card Draw Logic
            drawCardBtn.addEventListener('click', handleDrawCard);
            drawCard.addEventListener('click', handleDrawCard);

            function handleDrawCard() {
                if (state.cardOptions.length === 0) {
                    openOptionsModal();
                    return;
                }

                if (state.cardFlipped) {
                    // Reset card face down first then flip new option
                    drawCard.classList.remove('flipped');
                    state.cardFlipped = false;
                    playSound('card');
                    setTimeout(() => {
                        executeCardDraw();
                    }, 400);
                } else {
                    executeCardDraw();
                }
            }

            function executeCardDraw() {
                triggerHaptic();
                playSound('card');

                const randomIndex = Math.floor(Math.random() * state.cardOptions.length);
                const selectedOption = state.cardOptions[randomIndex];

                cardResultText.textContent = selectedOption;
                drawCard.classList.add('flipped');
                state.cardFlipped = true;

                addHistory('抽卡决策', selectedOption);
            }

            shuffleBtn.addEventListener('click', () => {
                if (state.cardFlipped) {
                    drawCard.classList.remove('flipped');
                    state.cardFlipped = false;
                }
                triggerHaptic();
                playSound('card');
            });

            // Options Modal logic
            const manageOptionsBtn = document.getElementById('manage-options-btn');
            const closeOptionsBtn = document.getElementById('close-options-btn');
            const saveOptionsBtn = document.getElementById('save-options-btn');
            const addOptionBtn = document.getElementById('add-option-btn');
            const newOptionInput = document.getElementById('new-option-input');
            const clearOptionsBtn = document.getElementById('clear-options-btn');

            manageOptionsBtn.addEventListener('click', openOptionsModal);
            closeOptionsBtn.addEventListener('click', closeOptionsModal);
            saveOptionsBtn.addEventListener('click', closeOptionsModal);

            function openOptionsModal() {
                renderOptionsList();
                optionsModal.classList.remove('hidden');
                optionsModal.classList.add('flex');
            }

            function closeOptionsModal() {
                optionsModal.classList.add('hidden');
                optionsModal.classList.remove('flex');
                updateOptionCount();
            }

            function updateOptionCount() {
                document.getElementById('option-count-text').textContent = `自定义选项 (${state.cardOptions.length})`;
                if (state.cardOptions.length === 0) {
                    cardResultText.textContent = '点击右下角按钮添加选项';
                }
            }

            function renderOptionsList() {
                optionsList.innerHTML = '';
                if (state.cardOptions.length === 0) {
                    optionsList.innerHTML = `<p class="text-center text-xs text-gray-400 py-8 tracking-wider">尚无选项，请在上方输入添加</p>`;
                    return;
                }

                state.cardOptions.forEach((opt, idx) => {
                    const item = document.createElement('div');
                    item.className = 'flex items-center justify-between bg-paper-100 dark:bg-paper-800 p-2.5 rounded-xl border border-paper-200 dark:border-paper-700/50';
                    item.innerHTML = `
                        <span class="text-xs font-medium pl-1 truncate max-w-[210px] text-paper-800 dark:text-paper-100">${opt}</span>
                        <button data-index="${idx}" class="remove-opt-btn w-6 h-6 rounded-lg text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 flex items-center justify-center transition-colors">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    `;
                    optionsList.appendChild(item);
                });

                document.querySelectorAll('.remove-opt-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const idx = parseInt(e.currentTarget.getAttribute('data-index'));
                        state.cardOptions.splice(idx, 1);
                        saveCardOptions();
                        renderOptionsList();
                    });
                });
            }

            addOptionBtn.addEventListener('click', addNewOption);
            newOptionInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addNewOption();
            });

            function addNewOption() {
                const val = newOptionInput.value.trim();
                if (val) {
                    state.cardOptions.push(val);
                    newOptionInput.value = '';
                    saveCardOptions();
                    renderOptionsList();
                }
            }

            clearOptionsBtn.addEventListener('click', () => {
                state.cardOptions = [];
                saveCardOptions();
                renderOptionsList();
            });

            function saveCardOptions() {
                localStorage.setItem('userCardOptions', JSON.stringify(state.cardOptions));
            }

            // History Modal Logic
            const historyToggle = document.getElementById('history-toggle');
            const closeHistoryBtn = document.getElementById('close-history-btn');
            const clearHistoryBtn = document.getElementById('clear-history-btn');

            historyToggle.addEventListener('click', () => {
                renderHistory();
                historyModal.classList.remove('hidden');
                historyModal.classList.add('flex');
            });

            closeHistoryBtn.addEventListener('click', () => {
                historyModal.classList.add('hidden');
                historyModal.classList.remove('flex');
            });

            clearHistoryBtn.addEventListener('click', () => {
                state.history = [];
                localStorage.setItem('decisionHistory', JSON.stringify([]));
                renderHistory();
            });

            function addHistory(type, result) {
                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                
                state.history.unshift({ type, result, time: timeStr });
                if (state.history.length > 20) state.history.pop();

                localStorage.setItem('decisionHistory', JSON.stringify(state.history));
            }

            function renderHistory() {
                historyList.innerHTML = '';
                if (state.history.length === 0) {
                    historyList.innerHTML = `<p class="text-center text-xs text-gray-400 py-10 tracking-widest">无历史记录</p>`;
                    return;
                }

                state.history.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between p-3 rounded-xl bg-paper-100 dark:bg-paper-800 border border-paper-200 dark:border-paper-700/40';
                    row.innerHTML = `
                        <div class="flex items-center space-x-2.5">
                            <span class="px-2 py-0.5 rounded text-[10px] font-semibold tracking-wider ${item.type === '是 / 否 决策' ? 'bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-300' : 'bg-brand-light text-brand'}">
                                ${item.type}
                            </span>
                            <span class="text-xs font-semibold tracking-wider">${item.result}</span>
                        </div>
                        <span class="text-[10px] text-gray-400">${item.time}</span>
                    `;
                    historyList.appendChild(row);
                });
            }

            // Init App
            initTheme();
            updateOptionCount();
        });
    </script>
</body>
</html>
